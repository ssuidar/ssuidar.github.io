name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A615DD: ${{ secrets.A615DD }}
          BA9F5D: ${{ secrets.BA9F5D }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A615DD', ''), os.environ.get('BA9F5D', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 1fe8533849ddc856b8105234 -->', a)
          if b:
              patched = patched.replace('<!-- 9e1e9fc84fa60d9ab79f13f55aabf8fa9c39b2 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
